<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We'll Be Back Soon</title>

    <style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #dbefff, #f5fbff);
        color: #ffcc00; /* Golden Yellow */
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        max-width: 600px;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    }

    p {
        font-size: 18px;
        margin-bottom: 30px;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }

    .loader {
        border: 6px solid rgba(0,0,0,0.1);
        border-top: 6px solid #ffcc00; /* match yellow */
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: auto;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .footer {
        margin-top: 30px;
        font-size: 14px;
        opacity: 0.9;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
</style>
</head>

<body>

<div class="container">
    <h1>🚧 We'll Be Back Soon</h1>
    <p>Our website is currently under maintenance.<br>
       We're working hard to improve your experience.</p>

    <div class="loader"></div>

    <div class="footer">
   |- © 2026 softwaretesting-institute.com | All Rights Reserved
    </div>
</div>

</body>
</html>
